<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Gallery — პრემიუმ საჩუქრები წყვილებისთვის</title>
    
    <!-- Georgian Localization Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@300;400&family=Noto+Sans+Georgian:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Breathing Background -->
    <div class="breathing-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Wrapper -->
    <main id="app-root">
        
        <!-- Header Section -->
        <header class="header">
            <p class="brand-sub">კურატორული კოლექცია</p>
            <h1 class="brand-title">Eternal Gallery</h1>
        </header>

        <!-- Liquid Glass Category Nav -->
        <nav class="category-nav">
            <div class="category-track" id="category-track">
                <div id="liquid-pill" class="liquid-pill"></div>
                <button class="cat-btn active" data-cat="all">ყველა</button>
                <button class="cat-btn" data-cat="for-her">გოგოსთვის</button>
                <button class="cat-btn" data-cat="for-him">ბიჭისთვის</button>
                <button class="cat-btn" data-cat="for-couples">წყვილისთვის</button>
            </div>
        </nav>

        <!-- Gallery View -->
        <section id="view-gallery" class="view active">
            <div id="bento-grid" class="bento-grid">
                <!-- Products injected here -->
            </div>
            
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-icon">✨</div>
                <p>ამ კატეგორიაში პროდუქტები მალე დაემატება</p>
            </div>

            <div id="load-more-wrap" class="load-more-wrap">
                <button id="load-more-btn" class="load-more-btn">მეტის ნახვა</button>
            </div>
        </section>

        <!-- Profile View -->
        <section id="view-profile" class="view">
            <div class="profile-container" id="profile-inner">
                <!-- Profile details injected here -->
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
